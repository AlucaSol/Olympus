<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Hades' Recall">
  <!-- Boon icon — see dionysus-revelry.svg for the shared plate convention.
       Deity colour: underworld violet over a darkened plate. -->
  <defs>
    <linearGradient id="hr-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2418"/><stop offset="1" stop-color="#14100a"/>
    </linearGradient>
    <radialGradient id="hr-void" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#06040a"/>
      <stop offset="0.72" stop-color="#1b0f2e"/>
      <stop offset="1" stop-color="#8f6ce0" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="48" height="48" fill="url(#hr-plate)"/>
  <!-- the shadow gate -->
  <circle cx="24" cy="26" r="17" fill="url(#hr-void)"/>
  <circle cx="24" cy="26" r="17" fill="none" stroke="#8f6ce0" stroke-width="1.4" opacity="0.8"/>
  <circle cx="24" cy="26" r="12.5" fill="none" stroke="#6a4aa8" stroke-width="1" opacity="0.7" stroke-dasharray="3 4"/>
  <!-- bident, the Unseen One's mark -->
  <path d="M24 40V13" stroke="#c9a84c" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M16 16V7l3 6V5m10 11V7l-3 6V5" fill="none" stroke="#e8c66a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M16 16q8 5 16 0" fill="none" stroke="#e8c66a" stroke-width="2.2" stroke-linecap="round"/>
  <!-- rising souls -->
  <g fill="#c9a8f0" opacity="0.9">
    <circle cx="15" cy="30" r="2"/><circle cx="33" cy="28" r="1.6"/><circle cx="28" cy="35" r="1.3"/>
    <circle cx="19" cy="37" r="1"/>
  </g>
</svg>
