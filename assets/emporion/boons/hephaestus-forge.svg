<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Hephaestus' Forge">
  <!-- Boon icon — see dionysus-revelry.svg for the shared plate convention.
       Deity colour: forge orange. -->
  <defs>
    <linearGradient id="hf-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f1a"/><stop offset="1" stop-color="#1c160c"/>
    </linearGradient>
    <radialGradient id="hf-glow" cx="0.5" cy="0.68" r="0.6">
      <stop offset="0" stop-color="#ffb050" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff8a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hf-anvil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d94a6"/><stop offset="1" stop-color="#454b5c"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" fill="url(#hf-plate)"/>
  <ellipse cx="24" cy="33" rx="20" ry="15" fill="url(#hf-glow)"/>
  <!-- forge fire under the anvil -->
  <path d="M17 43q-2-5 2-8 0 3 2 4 1-5 4-7 0 4 3 6 2-2 2-5 4 4 3 10z" fill="#ff8a3c"/>
  <path d="M20 43q-1-4 2-6 0 2 1 3 1-3 2-5 1 3 3 4 1-1 1-3 2 3 1 7z" fill="#ffd76a"/>
  <!-- anvil -->
  <path d="M8 20h27l6 4-6 1v3H15l-4-4H8z" fill="url(#hf-anvil)" stroke="#1a140a" stroke-width="1"/>
  <path d="M19 28h11v4l4 3H15l4-3z" fill="url(#hf-anvil)" stroke="#1a140a" stroke-width="1"/>
  <path d="M9 21h24" stroke="#c3c9d8" stroke-width="1.2" stroke-linecap="round"/>
  <!-- hammer, struck mid-blow -->
  <path d="M28 4 41 15" stroke="#7a4a22" stroke-width="3" stroke-linecap="round"/>
  <path d="M22 6.5 29 2l5 5-6.5 4.5z" fill="#c9a84c" stroke="#6b5320" stroke-width="1" stroke-linejoin="round"/>
  <!-- struck sparks + rune -->
  <g stroke="#ffe9a8" stroke-width="1.6" stroke-linecap="round">
    <path d="M13 17 9 12"/><path d="M18 16v-5"/><path d="M23 17l4-5"/>
  </g>
  <path d="M36 30h6M39 27v6" stroke="#ffd76a" stroke-width="1.5" stroke-linecap="round"/>
</svg>
