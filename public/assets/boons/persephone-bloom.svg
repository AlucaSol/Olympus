<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Persephone's Bloom">
  <!-- Boon icon — see dionysus-revelry.svg for the shared plate convention.
       Deity colour: bloom pink, with her underworld half kept in shadow. -->
  <defs>
    <linearGradient id="pb-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2f1a"/><stop offset="0.5" stop-color="#241c14"/>
      <stop offset="1" stop-color="#171021"/>
    </linearGradient>
    <radialGradient id="pb-glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#e070b0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e070b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="48" height="48" fill="url(#pb-plate)"/>
  <circle cx="24" cy="20" r="18" fill="url(#pb-glow)"/>
  <!-- twisting vines out of the dark earth -->
  <path d="M24 44V22" stroke="#5f9648" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M24 36q-8-1-9-8 7 0 9 5z" fill="#4a7a3d"/>
  <path d="M24 30q8-1 9-7-7 0-9 5z" fill="#7fc25e"/>
  <path d="M13 44q3-8 11-9" stroke="#4a7a3d" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M35 44q-3-8-11-9" stroke="#7fc25e" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- the flower: six petals, the lower-left pair still touched by shade -->
  <g>
    <ellipse cx="24" cy="10" rx="4" ry="7" fill="#f090c8"/>
    <ellipse cx="24" cy="10" rx="4" ry="7" fill="#e070b0" transform="rotate(60 24 17)"/>
    <ellipse cx="24" cy="10" rx="4" ry="7" fill="#c05a96" transform="rotate(120 24 17)"/>
    <ellipse cx="24" cy="10" rx="4" ry="7" fill="#8a4a86" transform="rotate(180 24 17)"/>
    <ellipse cx="24" cy="10" rx="4" ry="7" fill="#7d4a9c" transform="rotate(240 24 17)"/>
    <ellipse cx="24" cy="10" rx="4" ry="7" fill="#d868a8" transform="rotate(300 24 17)"/>
  </g>
  <circle cx="24" cy="17" r="4" fill="#e8c66a"/>
  <circle cx="24" cy="17" r="1.8" fill="#8a6a20"/>
  <!-- drifting petals / ethereal motes -->
  <g fill="#f0b8dc" opacity="0.9">
    <ellipse cx="9" cy="14" rx="2.4" ry="1.4" transform="rotate(-30 9 14)"/>
    <ellipse cx="39" cy="11" rx="2" ry="1.2" transform="rotate(25 39 11)"/>
    <ellipse cx="41" cy="24" rx="1.5" ry="0.9" transform="rotate(-15 41 24)"/>
  </g>
  <g fill="#b48ce0" opacity="0.85">
    <circle cx="12" cy="27" r="1.5"/><circle cx="7" cy="33" r="1.1"/>
  </g>
</svg>
