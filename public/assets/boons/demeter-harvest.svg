<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Demeter's Harvest">
  <!-- Boon icon — see dionysus-revelry.svg for the shared plate convention.
       Deity colour: grain green. -->
  <defs>
    <linearGradient id="dh-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f1a"/><stop offset="1" stop-color="#1c160c"/>
    </linearGradient>
    <radialGradient id="dh-glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#7fc25e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7fc25e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="48" height="48" fill="url(#dh-plate)"/>
  <circle cx="24" cy="24" r="20" fill="url(#dh-glow)"/>
  <!-- sheaf: three stalks bound at the waist -->
  <g stroke="#e8c66a" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M24 42V13"/><path d="M15 41 18 18"/><path d="M33 41 30 18"/>
  </g>
  <g fill="#c9a84c">
    <path d="M24 12q5 2 5 6.5T24 21q-5-2-5-5.5T24 12z"/>
    <path d="M17.6 17q4.4 2.4 3.8 6.8T16 26q-4-2.6-3.2-6.4T17.6 17z"/>
    <path d="M30.4 17q-4.4 2.4-3.8 6.8T32 26q4-2.6 3.2-6.4T30.4 17z"/>
  </g>
  <path d="M24 12v9M17.8 18.4 20 25M30.2 18.4 28 25" stroke="#8a6a20" stroke-width="1" fill="none"/>
  <!-- binding cord -->
  <path d="M15 31h18" stroke="#a07f38" stroke-width="3" stroke-linecap="round"/>
  <!-- flowers breaking through -->
  <g fill="#7fc25e">
    <path d="M11 39q2-6 6-7-1 6-6 7z"/><path d="M37 39q-2-6-6-7 1 6 6 7z"/>
  </g>
  <circle cx="10.5" cy="33.5" r="2.6" fill="#e8dcc0"/><circle cx="10.5" cy="33.5" r="1.1" fill="#e8c66a"/>
  <circle cx="37.5" cy="33.5" r="2.2" fill="#e070b0"/><circle cx="37.5" cy="33.5" r="0.9" fill="#e8c66a"/>
</svg>
